name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The code uses package:material_ui, which needs the master channel.
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Surface the failure as an annotation so it is readable without logs.
            msg=$(grep -A14 -iE "went wrong" build.log | head -n 30 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=APK build failed::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lubdub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
